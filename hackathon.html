
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Projects | Amni Zahirah</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .canva-page {
            max-width: 1100px;
            margin: auto;
            padding: 60px 8%;
        }

        .canva-intro {
            text-align: center;
            margin-bottom: 50px;
        }

        .canva-intro h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            margin-bottom: 15px;
        }

        .canva-intro p {
            max-width: 650px;
            margin: auto;
            line-height: 1.8;
        }

        .canva-section-title {
            margin-bottom: 25px;
        }

        .canva-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .canva-card {
            border: 1px solid rgba(150, 100, 100, 0.2);
            border-radius: 16px;
            overflow: hidden;
            background: var(--card-bg, #fff);
            transition: transform 0.3s ease;
        }

        .canva-card:hover {
            transform: translateY(-5px);
        }

        .canva-card img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #f4e5e5;
        }

        .canva-card-content {
            padding: 20px;
        }

        .canva-card-content h3 {
            margin-bottom: 10px;
        }

        .canva-card-content p {
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .canva-link {
            display: inline-block;
            color: inherit;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
            padding-bottom: 3px;
        }

        .canva-link:hover {
            opacity: 0.7;
        }

        .canva-back {
            display: inline-block;
            margin-bottom: 35px;
            color: inherit;
            text-decoration: none;
        }

        .canva-back:hover {
            text-decoration: underline;
        }

        .canva-footer {
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 600px) {
            .canva-page {
                padding: 35px 6%;
            }

            .canva-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>
            <a href="index.html" class="logo">Amni Zahirah.</a>
        </nav>
    </header>

    <main class="canva-page">

        <a href="index.html#projects" class="canva-back">
            ← Back to Projects
        </a>

        <!-- Page Introduction -->
        <section class="canva-intro">
            <p>UTM HACKATHON</p>
            <h1>Canva Projects</h1>
        </section>

        <!-- Hackathon Projects -->
        <section>
            <a class="canva-section-title" href="https://canva.link/ufz7ou8yfjd4s8i"><h1>1. totebag</h1></a>
            <a class="canva-section-title" href="https://canva.link/7ym6kkng1g1wsyv"><h1>2. poster timeline</h1></a>
            <a class="canva-section-title" href="https://canva.link/jd5kl2uplwoy21a"><h1>3. poster guideline</h1></a>
            <a class="canva-section-title" href="https://canva.link/s4zng2tietaxjtq"><h1>4.. winner announcement</h1></a>

           
        </section>

    </main>

    <footer class="canva-footer">
        <p>© 2026 Amni Zahirah. All rights reserved.</p>
    </footer>

</body>
</html>
